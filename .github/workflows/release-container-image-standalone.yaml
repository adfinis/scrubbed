name: Release Container Image - Standalone

on:
  schedule:
    - cron: '3 3 * * *'
  pull_request:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Create Semantic Release"]
    types:
      - completed

jobs:
  container:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Get version from tag
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            git fetch --tags --force
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            if [[ -n "$TAG" ]]; then
              VERSION="${TAG#v}"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "major=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"
              MINOR="${VERSION#*.}"
              echo "minor=v${VERSION%%.*}.${MINOR%%.*}" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure Image Metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            quay.io/adfinis/scrubbed
          tags: |
            type=schedule,pattern=nightly
            type=edge,enable=${{ github.event_name == 'push' && github.ref_name == 'main' }}
            type=ref,event=pr
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=v${{ steps.get-version.outputs.version }}
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=${{ steps.get-version.outputs.major }}
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=${{ steps.get-version.outputs.minor }}
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=latest

      - name: Login to quay.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME}}
          password: ${{ secrets.QUAY_ACCESS_TOKEN }}
        if: ${{ github.event_name != 'pull_request' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
