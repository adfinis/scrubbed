name: Release Container Image - With Signalilo

on:
  schedule:
    - cron: '3 3 * * *'
  pull_request:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Create Semantic Release"]
    types:
      - completed

jobs:
  container:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Get version from tag
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            git fetch --tags --force
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            if [[ -n "$TAG" ]]; then
              VERSION="${TAG#v}"
              echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
              echo "major=v${VERSION%%.*}" >> "$GITHUB_OUTPUT"
              MINOR="${VERSION#*.}"
              echo "minor=v${VERSION%%.*}.${MINOR%%.*}" >> "$GITHUB_OUTPUT"
              echo "found=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Configure Image Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            quay.io/adfinis/scrubbed-signalilo
          tags: |
            type=schedule,pattern=nightly
            type=edge,enable=${{ github.event_name == 'push' || github.event_name == 'workflow_run' }}
            type=ref,event=pr
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=v${{ steps.get-version.outputs.version }}
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=${{ steps.get-version.outputs.major }}
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=${{ steps.get-version.outputs.minor }}
            type=raw,enable=${{ steps.get-version.outputs.found == 'true' }},value=latest

      - name: Login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME}}
          password: ${{ secrets.QUAY_ACCESS_TOKEN }}
        if: ${{ github.event_name != 'pull_request' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.signalilo
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
